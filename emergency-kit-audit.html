<title>Emergency Kit Audit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: field-manual clipboard — sticky tab strip over one working column; kits read as manila inventory tags */
:root {
  --paper: #EDF0EA;
  --card: #F9FBF6;
  --ink: #17201B;
  --ink-2: #4A5650;
  --rule: #C9D0C4;
  --accent: #1F5BA8;
  --accent-ink: #FFFFFF;
  --meter: #7D8A82;
  --tag: #EFE3BC;
  --tag-ink: #3D3418;
  --good: #2C7A4B;
  --warn: #A86A12;
  --bad: #B42318;
  --f-display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --f-body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #111613; --card: #19201C; --ink: #E4EAE3; --ink-2: #A0ACA4; --rule: #2E3832;
    --accent: #8AB4F8; --accent-ink: #0B1526; --meter: #8A968E; --tag: #3A3320; --tag-ink: #EDE2BF;
    --good: #5BC489; --warn: #E2AE4A; --bad: #F2695C; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #111613; --card: #19201C; --ink: #E4EAE3; --ink-2: #A0ACA4; --rule: #2E3832;
  --accent: #8AB4F8; --accent-ink: #0B1526; --meter: #8A968E; --tag: #3A3320; --tag-ink: #EDE2BF;
  --good: #5BC489; --warn: #E2AE4A; --bad: #F2695C; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--paper); color: var(--ink); font: 14px/1.45 var(--f-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
h1, h2, h3 { font-weight: 600; text-wrap: balance; margin: 0; line-height: 1.2; }
h1 { font-family: var(--f-display); font-weight: 700; letter-spacing: .01em; }
h2 { font-size: 1.1rem; letter-spacing: -.005em; }
h3 { font-size: 1rem; }
.wiz h2 { font-size: 1.3rem; }
h3 { font-size: 1.1rem; }
p { margin: 0; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-2); }
.small { font-size: .85rem; }
.eyebrow { font-size: .78rem; font-weight: 600; color: var(--ink-2); }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border-bottom: 1px solid var(--rule); }
.top-in, .wrap { max-width: 1100px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top-in { display: flex; align-items: center; justify-content: space-between; gap: 12px 20px; flex-wrap: wrap; padding-block: 8px 0; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand-mark { width: 18px; height: 18px; background: #E0612A; clip-path: polygon(50% 0, 100% 100%, 0 100%); }
.brand h1 { font-size: 1.25rem; text-transform: uppercase; }
.hdr-score { font-size: .85rem; font-variant-numeric: tabular-nums; display: flex; align-items: baseline; gap: 6px; }
.hdr-score b { font-family: var(--f-display); font-size: 1.3rem; }
nav.tabs { display: flex; gap: 4px; overflow-x: auto; width: 100%; }
nav.tabs button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 6px 10px 5px; font-weight: 600; font-size: .9rem; color: var(--ink-2); cursor: pointer; white-space: nowrap; }
nav.tabs button[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
nav.tabs button:hover { color: var(--ink); }

main.wrap { padding-block: 14px 48px; display: grid; gap: 16px; }
section.view { display: grid; gap: 16px; min-width: 0; }
.stack { display: grid; gap: 8px; min-width: 0; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.panel { background: var(--card); border: 1px solid var(--rule); border-radius: 6px; padding: 12px 14px; min-width: 0; }
.notice { border-left: 4px solid var(--accent); background: var(--card); padding: 8px 12px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.notice p { max-width: 70ch; }

.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); border-radius: 4px; padding: 6px 12px; font-weight: 600; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--rule); }
.btn.ghost:hover { border-color: var(--ink-2); }
.btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.sm { padding: 2px 8px; font-size: .8rem; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.x { background: none; border: 0; color: var(--ink-2); cursor: pointer; padding: 4px 8px; border-radius: 4px; font-size: 1.1rem; line-height: 1; }
.x:hover { color: var(--bad); background: color-mix(in srgb, var(--bad) 10%, transparent); }

input[type=text], input[type=number], input[type=month], input[type=date], input[type=tel], select, textarea { background: var(--paper); border: 1px solid var(--rule); border-radius: 4px; padding: 5px 8px; min-width: 0; }
textarea { width: 100%; min-height: 56px; resize: vertical; }
label.f { display: grid; gap: 4px; font-size: .85rem; color: var(--ink-2); }
label.f > input, label.f > select { color: var(--ink); font-size: .95rem; }

/* Overview */
.ell { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sum { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 10px 24px; }
.sum-score { display: grid; gap: 6px; align-content: start; }
.sum-note { grid-column: 1 / -1; border-top: 1px dashed var(--rule); padding-top: 8px; }
@media (max-width: 760px) { .sum { grid-template-columns: 1fr; } }
.tab-n { font-size: .75rem; font-variant-numeric: tabular-nums; color: var(--accent); }
.next { display: grid; grid-template-columns: minmax(0, 1fr) 230px; gap: 12px 28px; }
.next .sum-score { border-left: 1px dashed var(--rule); padding-left: 20px; }
@media (max-width: 760px) { .next { grid-template-columns: 1fr; } .next .sum-score { border-left: 0; padding-left: 0; border-top: 1px dashed var(--rule); padding-top: 10px; } }
.acts { list-style: none; margin: 0; padding: 0; display: grid; border-top: 1px solid var(--rule); }
.act { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 6px 12px; align-items: start; padding: 10px 0; border-bottom: 1px solid var(--rule); }
.act-n { width: 30px; height: 30px; border-radius: 8px; background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent); display: grid; place-items: center; }
.ic { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.ic-s { width: 14px; height: 14px; }
.cat-td { display: flex; align-items: center; gap: 6px; color: var(--ink-2); }
.shop-chk > .ic { color: var(--ink-2); margin-top: 1px; }
.act-b { display: grid; gap: 2px; min-width: 0; }
.act-b b { font-size: 1rem; font-weight: 600; }
.act-do { display: flex; align-items: center; gap: 10px; padding-top: 1px; }
.gain { color: var(--good); font-size: .85rem; font-weight: 500; }
@media (max-width: 560px) { .act { grid-template-columns: 30px minmax(0, 1fr); } .act-do { grid-column: 2; } }
.score { display: flex; align-items: baseline; gap: 6px; }
.score .num { font-family: var(--f-display); font-size: 3.2rem; font-weight: 700; line-height: .9; }
.score .of { color: var(--ink-2); }
.gaps { list-style: none; margin: 4px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); column-gap: 20px; }
.gaps li { display: grid; grid-template-columns: minmax(0, 7.5em) auto minmax(0, 1fr); gap: 10px; align-items: baseline; padding: 3px 0; border-bottom: 1px solid var(--rule); font-size: .88rem; }
.gaps li b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gaps .amt { font-variant-numeric: tabular-nums; font-size: .8rem; white-space: nowrap; }
.gaps .why { font-size: .8rem; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: right; }

.ov-cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.45fr); gap: 24px; align-items: start; }
@media (max-width: 900px) { .ov-cols { grid-template-columns: 1fr; } }
.sec-h { display: flex; justify-content: space-between; align-items: baseline; gap: 4px 12px; flex-wrap: wrap; }
.grp { display: grid; gap: 4px; }
.grp + .grp { margin-top: 10px; }
.grp-h { display: grid; gap: 2px; }

.hz { display: grid; border-top: 1px solid var(--rule); }
.hz-row { display: grid; grid-template-columns: minmax(0, 1fr) 104px 56px 36px 24px; gap: 10px; align-items: center; padding: 3px 0; border-bottom: 1px solid var(--rule); font-size: .9rem; }
.hz-row.off { opacity: .55; }
.hz-name, .kit-name { display: flex; gap: 8px; align-items: baseline; background: none; border: 0; padding: 2px 0; text-align: left; cursor: pointer; }
.hz-name b, .kit-name b { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
.hz-name .mode, .kit-name .mode { flex: 1 1 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.hz-name:hover b, .kit-name:hover b { color: var(--accent); }
.mode { font-size: .78rem; color: var(--ink-2); }
.bar { height: 7px; background: var(--rule); border-radius: 2px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--c); }
.pct { font-family: var(--f-mono); font-size: .82rem; text-align: right; font-weight: 500; }
.hz-row .x { padding: 2px 6px; font-size: 1rem; }
.hz-detail { grid-column: 1 / -1; display: grid; gap: 6px; padding: 2px 0 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: .78rem; border: 1px solid var(--rule); color: var(--ink); border-radius: 999px; padding: 2px 9px 2px 7px; font-variant-numeric: tabular-nums; }
.chip .ic { color: var(--ink-2); }
.chip.full { border-color: color-mix(in srgb, var(--good) 45%, var(--rule)); background: color-mix(in srgb, var(--good) 9%, transparent); }
.chip.full .ic { color: var(--good); }
.lvl { font-size: .78rem; padding: 2px 4px; }
.hz-lvl.alarm { color: var(--bad); font-weight: 600; }
.hz-lvl .pri { color: var(--accent); }
.hz-like { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; color: var(--ink-2); }
@media (max-width: 560px) {
  .hz-row { grid-template-columns: minmax(0, 1fr) 100px 36px 24px; }
  .hz-row .bar, .hz-name .mode { display: none; }
  .hz-name, .hz-name b { white-space: normal; }
}
.kit-row { display: grid; grid-template-columns: minmax(0, 1fr) 72px 40px; gap: 0 10px; align-items: center; padding: 3px 0; border-bottom: 1px solid var(--rule); font-size: .9rem; }
.kit-row .kit-miss { grid-column: 1 / -1; margin-top: -2px; }
.kit-pct { font-family: var(--f-display); font-size: 1.9rem; font-weight: 700; line-height: 1; }
.exp-row { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; border-bottom: 1px solid var(--rule); font-size: .88rem; }
.exp-row .flag { flex: none; font-size: .72rem; }

/* Kits */
.kits-grid { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 860px) { .kits-grid { grid-template-columns: 1fr; } }
.tags { display: grid; gap: 6px; }
.tag { position: relative; text-align: left; background: var(--tag); color: var(--tag-ink); border: 1px solid color-mix(in srgb, var(--tag-ink) 25%, transparent); border-radius: 4px 12px 12px 4px; padding: 6px 10px 6px 26px; cursor: pointer; display: grid; gap: 0; width: 100%; line-height: 1.3; }
.tag::before { content: ""; position: absolute; left: 9px; top: 50%; width: 8px; height: 8px; margin-top: -4px; border-radius: 50%; background: var(--paper); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--tag-ink) 40%, transparent); }
.tag[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: 1px; }
.tag { padding-right: 54px; }
.tag-pct { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-family: var(--f-display); font-size: 1.3rem; font-weight: 700; }
.tag b { font-family: var(--f-display); font-size: 1.12rem; letter-spacing: .01em; }
.tag .mono { font-size: .68rem; opacity: .85; }
.photos { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.photos img { width: 60px; height: 60px; object-fit: cover; border-radius: 4px; border: 1px solid var(--rule); flex: none; background: var(--rule); }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 6px; background: var(--card); }
table { border-collapse: collapse; width: 100%; min-width: 960px; font-size: .85rem; }
th { text-align: left; font-weight: 600; font-size: .78rem; color: var(--ink-2); padding: 5px 6px; border-bottom: 1px solid var(--rule); }
td { padding: 1px 4px; border-bottom: 1px solid var(--rule); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td input:not([type=checkbox]), td select { width: 100%; padding: 3px 5px; background: transparent; border-color: transparent; }
td input:hover, td select:hover, td input:focus, td select:focus { border-color: var(--rule); background: var(--paper); }
td.num input { text-align: right; font-family: var(--f-mono); }
td .flag { font-size: .78rem; font-weight: 500; }
.flag.expired { color: var(--bad); } .flag.soon { color: var(--warn); }
td.val { padding-right: 8px; }
.val-in { display: flex; align-items: center; gap: 6px; }
.vbar { flex: 1; height: 6px; background: var(--rule); border-radius: 2px; overflow: hidden; }
.vbar i { display: block; height: 100%; background: var(--accent); }
.val-in b { width: 2.2em; text-align: right; font-weight: 500; }
.buy { display: inline-block; padding: 0 6px 2px; text-decoration: none; }
.buy:hover { text-decoration: underline; }
.val-note { display: block; font-size: .7rem; line-height: 1.2; color: var(--ink-2); padding-bottom: 2px; }
.th-sort { white-space: nowrap; background: none; border: 0; padding: 0; font: inherit; color: inherit; letter-spacing: inherit; text-transform: inherit; cursor: pointer; }
.th-sort[aria-pressed="true"] { color: var(--ink); }
.th-sort:hover { color: var(--accent); }
tr.addrow td { background: color-mix(in srgb, var(--accent) 5%, transparent); }
.working { display: flex; gap: 10px; align-items: center; }
.pulse { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); animation: pulse 1.2s ease-in-out infinite; flex: none; }
@keyframes pulse { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }

.pack-ms { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px 24px; }
.pack-m { display: grid; gap: 4px; }
.pack-lim { display: inline-flex; align-items: center; gap: 6px; }
.pack-lim input { width: 72px; }
.pack-over { color: var(--bad); font-weight: 600; }
.pack-l { margin: 0; padding-left: 1.1em; display: grid; gap: 3px; font-size: .88rem; }

/* Household */
.hh-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.people { display: grid; gap: 6px; }
.person { display: grid; grid-template-columns: minmax(0, 1.2fr) 76px minmax(0, 2fr) 32px; gap: 6px; align-items: center; padding-bottom: 6px; border-bottom: 1px solid var(--rule); }
.pneeds { grid-column: 1 / -1; font-size: .72rem; color: var(--ink-2); }
.conds { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px 16px; }
.conds label { display: inline-flex; gap: 5px; align-items: center; font-size: .8rem; color: var(--ink-2); cursor: pointer; }
.pet { display: grid; grid-template-columns: minmax(0, 1fr) 90px 32px; gap: 8px; align-items: center; max-width: 420px; }
@media (max-width: 640px) { .person { grid-template-columns: minmax(0, 1fr) 76px 32px; } .person .needs { grid-column: 1 / -1; grid-row: 2; } .person .pneeds { grid-row: 3; } .person .conds { grid-row: 4; } }
.cond-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 6px; align-items: start; }
.cond { border: 1px solid var(--rule); border-radius: 4px; background: var(--paper); }
.cond.on { border-color: var(--accent); }
.cond-t { display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; width: 100%; text-align: left; background: none; border: 0; padding: 7px 10px 7px 34px; cursor: pointer; position: relative; }
.cond-t::before { content: ""; position: absolute; left: 10px; top: 9px; width: 14px; height: 14px; border: 1.5px solid var(--ink-2); border-radius: 3px; }
.cond.on .cond-t::before { background: var(--accent); border-color: var(--accent); box-shadow: inset 0 0 0 2px var(--paper); }
.who-names { font-size: .78rem; color: var(--ink-2); }
.who { display: flex; flex-wrap: wrap; gap: 4px 16px; padding: 0 10px 8px 34px; }
.who label { display: inline-flex; gap: 6px; align-items: center; font-size: .85rem; cursor: pointer; }
.who input { accent-color: var(--accent); }
.wiz { max-width: 760px; gap: 14px; border-color: var(--accent); }
.wiz-dots { display: flex; gap: 4px; }
.wiz-dots i { width: 22px; height: 4px; border-radius: 2px; background: var(--rule); }
.wiz-dots i.on { background: var(--accent); }
.wiz-nav { border-top: 1px dashed var(--rule); padding-top: 10px; }

/* Shopping */
.shop { list-style: none; margin: 0; padding: 0; display: grid; border-top: 1px solid var(--rule); }
.shop-row { display: grid; grid-template-columns: minmax(0, 1fr) 84px 200px 28px; gap: 4px 12px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--rule); }
.shop-chk { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; min-width: 0; }
.shop-chk input { width: 18px; height: 18px; margin: 1px 0 0; accent-color: var(--accent); flex: none; cursor: pointer; }
.shop-chk > span { display: grid; gap: 1px; min-width: 0; }
.shop-row.done b { text-decoration: line-through; color: var(--ink-2); font-weight: 500; }
.shop-kit select { width: 100%; font-size: .85rem; }
.shop-meta { display: grid; justify-items: end; gap: 1px; font-variant-numeric: tabular-nums; }
.shop-tip { color: var(--ink-2); max-width: 64ch; margin-top: 2px; }
.shop-row.over { opacity: .6; }
.shop-cut { padding: 10px 0 4px; border-bottom: 1px dashed var(--rule); }
.shop-sum { margin: 0; }
.shop-tools { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; }
.shop-tools label { display: flex; gap: 6px; align-items: center; color: var(--ink-2); }
#shop-budget { width: 80px; }
.shop-add { display: flex; gap: 8px; }
.shop-add input { flex: 1; }
@media (max-width: 560px) {
  .shop-row { grid-template-columns: minmax(0, 1fr) 28px; }
  .shop-meta { grid-column: 1; grid-row: 2; display: flex; gap: 10px; justify-content: flex-start; padding-left: 56px; }
  .shop-kit { grid-column: 1; grid-row: 3; padding-left: 56px; }
  .shop-kit:empty, .shop-meta:empty { display: none; }
  .shop-row > .x { align-self: start; }
}
.reasons { display: grid; gap: 0; }
.reasons div { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: 10px; padding: 3px 0; border-bottom: 1px solid var(--rule); font-size: .9rem; }
@media (max-width: 640px) { .reasons div { grid-template-columns: 1fr; gap: 2px; } }

/* Review */
.review { max-width: 72ch; display: grid; gap: 10px; }
.plan-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; align-items: start; }
::placeholder { color: color-mix(in srgb, var(--ink-2) 50%, transparent); opacity: 1; }
.hint { font-size: .78rem; color: var(--ink-2); font-weight: 400; }
.med { display: grid; grid-template-columns: minmax(0, 140px) minmax(0, 1fr) 28px; gap: 6px; align-items: center; padding-bottom: 8px; border-bottom: 1px solid var(--rule); }
.med select { grid-area: 1 / 1; } .med input[type=text] { grid-area: 1 / 2; } .med .x { grid-area: 1 / 3; }
.med input[type=date] { grid-area: 2 / 1; } .med .med-st { grid-area: 2 / 2 / 3 / 4; }
.med-st.bad { color: var(--bad); font-weight: 600; } .med-st.warn { color: var(--warn); font-weight: 600; }
.review h3 { margin-top: 10px; }
.review ul { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }

td.sel, th.sel { width: 40px; text-align: center; padding-left: 10px; }
td.sel input, th.sel input { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }
tr.picked td { background: color-mix(in srgb, var(--bad) 8%, transparent); }

function packPanel(kit, ready) {

  const go = kit.type === "go";

  if (go && lim.kg && P.waterNeedG > lim.kg * 1000) notes.push(`Water for ${esc(servesLine(ready))} over 3 days weighs about ${kgText(P.waterNeedG)} kg, more than one person can carry. ${lim.carriers > 1 ? `Your household can carry about ${f1(lim.totalKg)} kg across ${lim.carriers} people, so split it into more bags.` : ""}`);
  if (go && lim.kg && P.waterG > lim.kg * 500) notes.push(`Water is ${kgText(P.waterG)} kg of this bag. A filter or purification tablets with one day of water is far lighter, but only stored water counts on the checklist, so the score would drop.`);
  return `<div class="panel stack">
    <div class="row" style="justify-content:space-between;align-items:baseline">
      <p class="eyebrow">Weight and space</p>
      <span class="small muted">${P.estN ? `${P.estN} of ${P.lines.length} item${P.lines.length === 1 ? "" : "s"} estimated` : "Every item has its own weight and size"}${P.estN && sample && S.canWrite ? ` <button class="btn ghost sm" data-act="packEstimate" data-id="${esc(kit.id)}" ${est?.state === "working" ? "disabled" : ""}>${est?.state === "working" ? "Estimating…" : "Estimate with Claude"}</button>` : ""}</span>

    </div>
    <p class="small muted">${go ? (lim.suggestedKg ? `Suggested carry limit ${f1(lim.suggestedKg)} kg, about what ${esc(lim.carrier)} can carry (a fifth of body weight for an adult, less for children and seniors). ` : "") + `Suggested bag ${lim.suggestedL} L, a typical hiking pack.` : `Suggested ${lim.suggestedL} L, a typical trunk bin.`}</p>

      <ul class="pack-l">${P.best.leave.map(x => li(x.it, `leave out ${x.n === Math.max(1, num(x.it.qty)) ? "all" : x.n}`, `${kgText(x.g)} kg`)).join("")}</ul></div>` : ""}

      <ul class="pack-l">${P.takeOut.map(x => li(x.it, x.n === Math.max(1, num(x.it.qty)) ? "" : `× ${x.n}`, `${esc(x.why)} · saves ${kgText(x.g)} kg`)).join("")}</ul></div>` : ""}

function viewShop(M) {
  const items = shopItems();
  const left = items.filter(x => !x.done), got = items.filter(x => x.done);
  const listed = new Set(left.map(x => x.cat));
  const unlisted = M.gaps.filter(g => !listed.has(g.cat)).length;
  const info = new Map(items.map(e => [e.id, shopInfo(e, M)]));
  const I = e => info.get(e.id);
  const kitName = id => S.kits.find(k => k.id === id)?.name;
  const kitOpts = e => { const cur = shopKit(e); return `<option value="none" ${cur ? "" : "selected"}>Not in a kit yet</option>` + S.kits.map(k => `<option value="${esc(k.id)}" ${k.id === cur ? "selected" : ""}>Goes in ${esc(k.name)}</option>`).join(""); };
  /* Points per dollar. Things already at home rank first; prescriptions can't be budgeted, so they rank last. */
  const ratio = e => { const i = I(e); return i.price == null ? -1 : i.price === 0 ? (i.gain ? 1e6 + i.gain : 0) : i.gain / i.price; };
  const sort = S.shopSort || "points";
  const order = [...left];
  if (sort === "points") order.sort((a, b) => I(b).gain - I(a).gain);
  else if (sort === "value") order.sort((a, b) => ratio(b) - ratio(a) || I(b).gain - I(a).gain);
  const budget = Math.max(0, num(S.budget));
  let pick = null, spent = 0;
  if (budget) {
    pick = new Set();
    for (const e of [...left].sort((a, b) => ratio(b) - ratio(a))) { const pr = I(e).price; if (pr != null && I(e).gain > 0 && spent + pr <= budget) { pick.add(e.id); spent += pr; } }
    order.sort((a, b) => pick.has(b.id) - pick.has(a.id));
  }
  const after = M.overall == null ? null : scoreIfBought(left);
  const pickAfter = pick && M.overall != null ? scoreIfBought(left.filter(e => pick.has(e.id))) : null;
  const total = left.reduce((a, e) => a + (I(e).price || 0), 0), rx = left.filter(e => I(e).price === null).length;
  const row = e => { const i = I(e); return `<li class="shop-row ${e.done ? "done" : ""} ${S.flash === e.id ? "flash" : ""} ${pick && !pick.has(e.id) && !e.done ? "over" : ""}">

    ${S.canWrite ? `<button class="x" data-act="shopDel" data-id="${esc(e.id)}" aria-label="Remove ${esc(i.line)} from the list">×</button>` : ""}

  </div>

    <div class="row" style="justify-content:space-between">
      <b>${left.length ? `${left.length} to buy` : "Nothing to buy yet"}</b>
      <div class="row">
        ${S.canWrite && unlisted && left.length ? `<button class="btn ghost sm" data-act="shopAddAll">Add ${unlisted} more gap${unlisted === 1 ? "" : "s"}</button>` : ""}
        ${left.length ? `<button class="btn ghost sm" data-act="shopShare">Share list</button>` : ""}
      </div>
    </div>
    ${left.length ? `
    <p class="shop-sum">About <b>$${total.toLocaleString()}</b>${rx ? ` plus ${rx} prescription item${rx === 1 ? "" : "s"}` : ""}.${after != null && after > M.overall ? ` Buying it all takes readiness from ${M.overall} to <b>${after}</b>.` : ""}</p>
    <div class="shop-tools">

    </div>
    <ul class="shop">${rows}</ul>`
      : M.gaps.length ? `<p class="small muted">Start with the gaps worth the most points. You can add the rest later.</p>
      ${S.canWrite ? `<div class="row"><button class="btn sm" data-act="shopAddTop">Add the top ${Math.min(5, M.gaps.length)}</button>${M.gaps.length > 5 ? `<button class="btn ghost sm" data-act="shopAddAll">Add all ${M.gaps.length}</button>` : ""}</div>` : ""}`

    <div class="row" style="justify-content:space-between"><b>Got it (${got.length})</b>${S.canWrite ? `<button class="btn ghost sm" data-act="shopClear">Clear these</button>` : ""}</div>
    <ul class="shop">${got.map(row).join("")}</ul>
  </div>` : ""}`;
}

function formatReview(t) {
  const out = []; let list = [];
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  const flush = () => { if (list.length) { out.push(`<ul>${list.map(l => `<li>${inline(l)}</li>`).join("")}</ul>`); list = []; } };
  for (const raw of t.split("\n")) {
    const line = raw.trim();
    if (!line) { flush(); continue; }
    if (/^#{1,4}\s/.test(line)) { flush(); out.push(`<h3>${inline(line.replace(/^#+\s*/, ""))}</h3>`); }
    else if (/^([-*•]|\d+[.)])\s/.test(line)) list.push(line.replace(/^([-*•]|\d+[.)])\s+/, ""));
    else { flush(); out.push(`<p>${inline(line)}</p>`); }
  }
  flush();
  return out.join("");
}

/* Days the stock would keep everyone going: the lower of water (3.8 L a person, about 1 L a pet) and food. */
const daysCovered = (st, h) => !st || !h.people ? 0 : Math.min(st.liters / (h.people * 3.8 + h.pets), h.kcalDay ? st.kcal / h.kcalDay : 0);
const MILESTONES = { home: [1, 3, 7, 14], go: [1, 3] };
const calm = () => typeof requestAnimationFrame !== "function" || !!window.matchMedia?.("(prefers-reduced-motion: reduce)").matches;
function celebrate(M) {
  if (!S.loaded) return;
  const now = { overall: M.overall, home: daysCovered(M.stocks.shelter, M.h), go: daysCovered(M.stocks.evacuate, M.h) };
  const prev = S.prev; S.prev = now;
  if (!prev) return;
  if (now.overall != null && prev.overall != null && now.overall > prev.overall) countUp(prev.overall, now.overall);
  const hit = k => [...MILESTONES[k]].reverse().find(d => prev[k] < d && now[k] >= d);
  const home = hit("home"), go = hit("go"), days = d => `${d} day${d === 1 ? "" : "s"}`;
  const msg = home ? `Milestone: your supplies at home now last ${days(home)} for everyone.`
    : go ? `Milestone: your go-bags and car kits now cover ${days(go)} on the move.` : "";
  if (msg) setTimeout(() => { if (!toastAction) toast(msg); }, 1600);
}
function countUp(from, to) {
  const hdr = $("#hdr-score");
  hdr.classList.remove("up"); void hdr.offsetWidth; hdr.classList.add("up");
  clearTimeout(S.upT); S.upT = setTimeout(() => hdr.classList.remove("up"), 1300);
  if (calm()) return;
  const t0 = performance.now();
  const step = t => {
    const k = Math.min(1, (t - t0) / 700), v = Math.round(from + (to - from) * (1 - (1 - k) ** 3));
    document.querySelectorAll("#hdr-score b, .sum-score .num").forEach(n => { n.textContent = v; });
    if (k < 1) S.upRaf = requestAnimationFrame(step);
  };
  cancelAnimationFrame(S.upRaf); S.upRaf = requestAnimationFrame(step);
}

async function shrink(file, max = 1600) {
  try {
    const bmp = await createImageBitmap(file);
    const s = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas");
    c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise(r => c.toBlob(b => r(b || file), "image/jpeg", 0.85));
  } catch (_) { return file; }
}
function cleanRows(out) {
  const arr = Array.isArray(out) ? out : Array.isArray(out?.items) ? out.items : [];
  return arr.filter(x => x && String(x.name || "").trim()).map(x => ({
    key: uid(),
    name: String(x.name).trim().slice(0, 80),
    category: CATS[x.category] ? x.category : "other",
    qty: Math.max(1, Math.round(num(x.qty) || 1)),
    liters: Math.round(num(x.liters) * 10) / 10,
    kcal: Math.round(num(x.kcal)),
    kg: Math.round(num(x.grams) / 100) / 10,
    L: Math.round(num(x.ml) / 100) / 10,
    expires: /^\d{4}-\d{2}$/.test(x.expires || "") ? x.expires : "",
    note: String(x.note || "").slice(0, 120),
    shop: typeof x.shop === "string" ? x.shop.trim().slice(0, 120) : "",
  }));
}
async function scanPhotos(files) {
  const kit = S.kits.find(k => k.id === S.openKit);

  if (!sample) { toast("Reading photos needs Claude, which this view can't reach. Add items by hand instead."); return; }
  const lim = await sample.limits().catch(() => null);
  if (!lim?.images) { toast("This view can't send photos to Claude. Add items by hand instead."); return; }
  const ctl = new AbortController();
  S.scan = { kitId: kit.id, state: "working", msg: `Preparing ${files.length} photo${files.length > 1 ? "s" : ""}…`, ctl };
  render();

      await delDoc("kits", id);
      S.openKit = null; toast(`Deleted ${kit?.name || "kit"}`);
    } catch (_) {}
    render();
  },
  hhAdd: b => { const k = b.dataset.k; S.hhDraft[k] = [...(S.hhDraft[k] || []), k === "members" ? { label: "", age: "adult", needs: "" } : { kind: "", count: 1 }]; S.hhDirty = true; render(); },
  hhDel: b => { const k = b.dataset.k; S.hhDraft[k].splice(+b.dataset.i, 1); S.hhDirty = true; render(); },
  condToggle: b => {
    const k = b.dataset.k, ms = S.hhDraft.members || [];
    const has = ms.filter(m => (m.conditions || []).includes(k));
    if (has.length) { has.forEach(m => { m.conditions = m.conditions.filter(c => c !== k); }); S.condOpen.delete(k); S.hhDirty = true; }
    else if (ms.length === 1) { ms[0].conditions = [...(ms[0].conditions || []), k]; S.hhDirty = true; }
    else S.condOpen.has(k) ? S.condOpen.delete(k) : S.condOpen.add(k);
    render();
  },
  startWizard: () => { S.view = "household"; S.wiz = 0; try { history.replaceState(null, "", "#household"); } catch (_) {} render(); window.scrollTo({ top: 0 }); },
  wizBack: () => { S.wiz = Math.max(0, S.wiz - 1); render(); },
  wizClose: () => { S.wiz = null; render(); },
  wizNext: () => wizStep(),
  shopAdd: b => {
    const M = model(), g = M.gaps.find(x => x.cat === b.dataset.cat); if (!g) return;
    saveShop([...shopItems(), shopFromGap(g, M.h)]);
    toast(`Added ${catLabel(g.cat).toLowerCase()} to your shopping list`);
  },
  shopAddAll: () => {
    const M = model(), have = new Set(shopItems().filter(x => !x.done).map(x => x.cat));
    const add = M.gaps.filter(g => !have.has(g.cat)).map(g => shopFromGap(g, M.h));
    if (!add.length) { toast("Every gap is already on your list"); return; }
    saveShop([...shopItems(), ...add]);
    toast(`Added ${add.length} item${add.length === 1 ? "" : "s"} to your shopping list`);
  },
  shopAddTop: () => {
    const M = model(), have = new Set(shopItems().filter(x => !x.done).map(x => x.cat));
    const add = M.gaps.filter(g => !have.has(g.cat)).map(g => ({ g, gain: M.overall == null ? 0 : scoreIfFilled(M, [g]) - M.overall }))
      .sort((a, b) => b.gain - a.gain || b.g.imp - a.g.imp).slice(0, 5).map(x => shopFromGap(x.g, M.h));
    if (!add.length) return;
    saveShop([...shopItems(), ...add]);
    toast(`Added the top ${add.length} to your shopping list`);
  },
  budgetClear: () => { S.budget = ""; render(); },
  shopDel: b => saveShop(shopItems().filter(x => x.id !== b.dataset.id)),
  shopClear: () => saveShop(shopItems().filter(x => !x.done)),
  shopShare: () => shareShop(),
  hzCheck: runHazardCheck,
  rvRun: runReview,
  rvStop: () => S.rv?.ctl?.abort(),
  clearExamples: async () => {
    S.confirm = null;
    try {
      const drop = S.kits.filter(isExampleKit), keep = S.kits.filter(k => k.example && !isExampleKit(k));
      await Promise.all(S.items.filter(i => i.example).map(i => delDoc("items", i.id)));
      await Promise.all(drop.map(k => delDoc("kits", k.id)));
      await Promise.all(keep.map(k => setDoc("kits", k.id, { ...strip(k), example: false })));
      if (S.profile?.example) { await delDoc("household", "profile"); S.hhDraft = { members: [{ label: "", age: "adult", needs: "" }], pets: [], vehicles: 0, home: "House" }; S.hhDirty = false; }
      S.openKit = null; toast("Examples removed");
    } catch (_) {}
    render();
  },
};
document.addEventListener("click", e => { const b = e.target.closest("[data-act]"); if (b && !b.disabled && ACT[b.dataset.act]) { e.preventDefault(); ACT[b.dataset.act](b); } });
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.input === "draft") {
    const r = S.draft?.rows[+t.dataset.i]; if (r) r[t.dataset.f] = t.value;
  } else if (t.dataset.input === "hh") {
    setPath(S.hhDraft, t.dataset.p, t.type === "number" ? (t.value === "" && t.dataset.blank ? "" : num(t.value)) : t.value);
    if (t.dataset.blank) { S.hhDirty = true; render(); return; }
    if (!S.hhDirty) { S.hhDirty = true; const btn = $('form[data-submit="saveHH"] button[type=submit]'); if (btn) btn.disabled = false; }
  }
});
document.addEventListener("change", async e => {
  const t = e.target;
  if (t.dataset.change === "item") {
    const it = S.items.find(i => i.id === t.dataset.id); if (!it) return;
    const f = t.dataset.f;
    let v = t.value;
    if (f === "qty") v = Math.max(1, Math.round(num(v) || 1)); else if (f === "liters" || f === "kcal") v = num(v); else if (f === "grams" || f === "ml") v = Math.round(num(v) * 1000); else if (f === "name") { v = v.trim(); if (!v) { t.value = it.name; return; } }
    if (it[f] === v) return;
    await setDoc("items", it.id, { ...strip(it), [f]: v }).catch(() => {});
  } else if (t.dataset.change === "packLim") {
    const kit = S.kits.find(k => k.id === t.dataset.id); if (!kit) return;
    const f = t.dataset.f, v = Math.round(num(t.value) * 2) / 2;
    if (v === num(kit[f])) return;
    const { [f]: _, ...rest } = strip(kit);
    await setDoc("kits", kit.id, v ? { ...rest, [f]: v } : rest).catch(() => {});
  } else if (t.dataset.change === "serves") {
    const kit = S.kits.find(k => k.id === t.dataset.id); if (!kit) return;
    const v = Math.min(50, Math.round(num(t.value)));
    if (!v) { t.value = num(kit.serves) || household().people; return; }
    if (v === num(kit.serves)) return;
    await setDoc("kits", kit.id, { ...strip(kit), serves: v }).catch(() => {});
  } else if (t.dataset.change === "sel") {
    t.checked ? S.sel.add(t.dataset.id) : S.sel.delete(t.dataset.id);
    render();
  } else if (t.dataset.change === "selAll") {
    const ids = S.items.filter(i => i.kitId === S.openKit).map(i => i.id);
    if (t.checked) ids.forEach(id => S.sel.add(id)); else S.sel.clear();
    render();
  } else if (t.dataset.change === "hhCond") {
    const m = S.hhDraft.members?.[+t.dataset.i]; if (!m) return;
    const cs = new Set(m.conditions || []);
    t.checked ? cs.add(t.dataset.k) : cs.delete(t.dataset.k);
    m.conditions = [...cs];
    S.hhDirty = true; render();
  } else if (t.dataset.change === "shopTick") {
    shopTick(t.dataset.id, t.checked);
  } else if (t.dataset.change === "shopKit") {
    saveShop(shopItems().map(x => x.id === t.dataset.id ? { ...x, kitId: t.value } : x));
  } else if (t.dataset.change === "plan") {
    const v = t.value.trim().slice(0, 120);
    if ((S.plan?.[t.dataset.f] || "") === v) return;
    await savePlan({ ...(S.plan || {}), [t.dataset.f]: v });
  } else if (t.dataset.change === "planMed") {
    const meds = clone(S.plan?.meds || []);
    if (!meds[+t.dataset.i]) return;
    meds[+t.dataset.i][t.dataset.f] = t.value.trim().slice(0, 80);
    await savePlan({ ...(S.plan || {}), meds });
  } else if (t.dataset.change === "shopSort") {
    S.shopSort = t.value; render();
  } else if (t.dataset.change === "budget") {
    S.budget = Math.max(0, Math.round(num(t.value))) || ""; render();
  } else if (t.dataset.change === "importance") {
    const importance = { ...(S.hazards?.importance || {}), [t.dataset.id]: t.value };
    if (t.value === "normal") delete importance[t.dataset.id];
    await setDoc("household", "hazards", { ...(S.hazards || {}), importance }).catch(() => {});
  } else if (t.dataset.change === "level") {
    const levels = { ...(S.hazards?.levels || {}), [t.dataset.id]: t.value };
    await setDoc("household", "hazards", { ...(S.hazards || {}), levels }).catch(() => {});
  } else if (t.id === "photo-input") {
    scanPhotos([...t.files]);
  }
});
document.addEventListener("submit", async e => {
  e.preventDefault();
  const f = e.target;
  if (f.dataset.submit === "newKit") {
    const name = $("#nk-name").value.trim(); if (!name) return;
    const type = KIT_TYPES[$("#nk-type").value] ? $("#nk-type").value : "go";
    const id = uid();
    await setDoc("kits", id, { name, type, where: $("#nk-where").value.trim(), photos: [], createdAt: Date.now() }).catch(() => {});
    S.openKit = id; f.reset(); render();
  } else if (f.dataset.submit === "saveHH") {
    await saveHousehold();
  } else if (f.dataset.submit === "wizNext") {
    await wizStep();
  } else if (f.dataset.submit === "shopNew") {
    const text = $("#shop-new").value.trim(); if (!text) return;
    $("#shop-new").value = "";
    await saveShop([...shopItems(), { id: uid(), cat: "", text: text.slice(0, 80), done: false, at: Date.now() }]);
    $("#shop-new")?.focus();
  }
});
async function saveHousehold() {
  const d = clone(S.hhDraft);
  d.members = (d.members || []).map(m => ({ label: String(m.label || "").trim(), years: yearsOf(m) == null ? null : Math.floor(yearsOf(m)), age: groupOf(m), needs: String(m.needs || "").trim(), conditions: (m.conditions || []).filter(c => CONDITIONS[c]) }));
  if (!d.members.length) d.members = [{ label: "", age: "adult", needs: "" }];
  d.pets = (d.pets || []).filter(p => num(p.count)).map(p => ({ kind: String(p.kind || "").trim(), count: num(p.count) }));
  d.location = String(d.location || "").trim();
  const data = { ...d, example: false, updatedAt: Date.now() };
  try { await setDoc("household", "profile", data); } catch (_) { return false; }
  if (db) S.profile = clone(data);
  S.hhDirty = false; S.hhDraft = d; S.condOpen.clear(); toast("Household saved"); render();
  return true;
}
/* Last step saves, then shows the next steps; a new location gets its hazards checked straight away. */
async function wizStep() {
  if (S.wiz < WIZ.length - 1) { S.wiz++; render(); window.scrollTo({ top: 0 }); return; }
  if (!(await saveHousehold())) return;
  S.wiz = null; S.view = "overview";
  try { history.replaceState(null, "", "#overview"); } catch (_) {}
  render(); window.scrollTo({ top: 0 });
  if (S.profile?.location && S.hazards?.location !== S.profile.location && sample) runHazardCheck();
}
/* Ticking an item puts it in its kit (so the gap closes); unticking takes that item back out. */
async function shopTick(id, on) {
  const items = clone(shopItems()), e = items.find(x => x.id === id); if (!e) return;
  if (on) {
    const kit = S.kits.find(k => k.id === shopKit(e));
    if (kit && CATS[e.cat]) {
      const before = model().overall, itemId = uid();
      try {
        await setDoc("items", itemId, { ...itemFromShop(e, kit.id), addedAt: Date.now() });
      } catch (_) { render(); return; }
      e.itemId = itemId; e.inKit = kit.id;
      const after = model().overall;
      toast(`Put in ${kit.name}${after > before ? `. Readiness ${before} → ${after}` : ""}`);
    }
    e.done = true;
    S.flash = e.id; clearTimeout(S.flashT); S.flashT = setTimeout(() => { S.flash = null; }, 1400);
  } else {
    if (e.itemId && S.items.some(i => i.id === e.itemId)) await delDoc("items", e.itemId).catch(() => {});
    e.done = false; delete e.itemId; delete e.inKit;
  }
  await saveShop(items);
}
async function shareShop() {
  const left = shopItems().filter(x => !x.done);
  if (!left.length) return;
  const M = model();
  const text = "Emergency kit shopping list\n" + left.map(x => { const i = shopInfo(x, M); return `- ${i.line}${i.sub && i.sub !== i.line ? ` (${i.sub})` : ""}`; }).join("\n");
  try { if (navigator.share) { await navigator.share({ title: "Emergency kit shopping list", text }); return; } }
  catch (e) { if (e?.name === "AbortError") return; }
  try { await navigator.clipboard.writeText(text); toast("List copied. Paste it into a message or your notes."); }
  catch (_) { toast("This view can't copy. Select the list and copy it instead."); }
}

/* ---------- boot ---------- */
function syncDraft() { if (!S.hhDirty) S.hhDraft = clone(S.profile) || { members: [{ label: "", age: "adult", needs: "" }], pets: [], vehicles: 0, home: "House", location: "" }; }
syncDraft();
render();
(async () => {
  const use = n => window.claude?.use ? window.claude.use(n).catch(() => null) : Promise.resolve(null);
  const [d, a, s, u] = await Promise.all([use("db"), use("assets"), use("sample"), use("user")]);
  db = d; assets = a; sample = s;
  if (u) { try { const ok = await u.canEdit(); if (ok === false) S.canWrite = false; } catch (_) {} }
  document.body.classList.toggle("ro", !S.canWrite);
  if (!db) {
    S.loaded = true; render(); return;
  }
  S.live = true;
  const timer = setTimeout(() => { S.slow = true; render(); }, 10000);
  const seen = new Set();
  const done = (k, snap) => { if (!snap.metadata?.fromCache) seen.add(k); if (seen.size >= 7) { S.loaded = true; S.slow = false; clearTimeout(timer); } };
  const fail = () => { clearTimeout(timer); S.loaded = true; render(); };
  db.collection("kits").onSnapshot(snap => { S.kits = snap.docs.map(x => ({ id: x.id, ...x.data() })); done("kits", snap); render(); }, fail);
  db.collection("items").onSnapshot(snap => { S.items = snap.docs.map(x => ({ id: x.id, ...x.data() })); done("items", snap); render(); }, fail);
  for (const key of ["profile", "hazards", "review", "shopping", "plan"]) {
    db.doc("household/" + key).onSnapshot(snap => {
      S[key] = snap.exists ? clone(snap.data()) : null;
      if (key === "profile") syncDraft();
      done(key, snap); render();
    }, fail);
  }
})();
</script>
