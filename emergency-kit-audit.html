<title>Emergency Kit Audit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="icon" type="image/svg+xml" href="data:,">
<style>
/* Layout: calm white workspace — one typeface, black controls, Cobalt for the brand, orange only for Partway progress.
   A sticky tab strip (a bottom bar on phones) over one working column; kits read as photo cards. */
:root {
  --paper: #F7F7F7;
  --card: #FFFFFF;
  --ink: #222222;
  --ink-2: #6A6A6A;
  --rule: #E4E4E4;
  --rule-2: #C8C8C8;
  --accent: #222222;
  --accent-ink: #FFFFFF;
  --brand: #2B59D9;
  --brand-track: #CCD8F6;
  --brand-tint: #E8EEFC;
  --brand-deep: #1E43AE;
  --meter: #E0612A;
  --good: #1F7A4A;
  --warn: #A86A12;
  --bad: #C1281B;
  --shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 2px 8px rgba(0, 0, 0, .04);
  --f-display: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #121212; --card: #1C1C1C; --ink: #F2F2F2; --ink-2: #A3A3A3; --rule: #2E2E2E; --rule-2: #4A4A4A;
    --accent: #F2F2F2; --accent-ink: #121212; --brand: #8AA8FF; --brand-track: #28385F; --meter: #F07A45;
    --good: #5BC489; --warn: #E2AE4A; --bad: #F2695C; --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #121212; --card: #1C1C1C; --ink: #F2F2F2; --ink-2: #A3A3A3; --rule: #2E2E2E; --rule-2: #4A4A4A;
  --accent: #F2F2F2; --accent-ink: #121212; --brand: #8AA8FF; --brand-track: #28385F; --meter: #F07A45;
  --good: #5BC489; --warn: #E2AE4A; --bad: #F2695C; --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--paper); color: var(--ink); font: 15px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--card); }
h1, h2, h3 { font-weight: 600; text-wrap: balance; margin: 0; line-height: 1.25; letter-spacing: -.01em; }
h1 { font-family: var(--f-display); }
h2 { font-size: 1.2rem; letter-spacing: -.015em; }
.wiz h2 { font-size: 1.4rem; }
h3 { font-size: 1.05rem; }
p { margin: 0; }
a { color: var(--ink); text-underline-offset: 2px; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.mono { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-2); }
.small { font-size: .85rem; }
.how { font-size: .85rem; color: var(--ink-2); }
.how summary { cursor: pointer; width: fit-content; text-decoration: underline dotted; text-underline-offset: 3px; }
.how p { max-width: 70ch; margin-top: 4px; }
.eyebrow { font-size: .8rem; font-weight: 500; color: var(--ink-2); }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--card); border-bottom: 1px solid var(--rule); }
.top-in, .wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top-in { display: flex; align-items: center; justify-content: space-between; gap: 4px 24px; flex-wrap: wrap; padding-block: 12px 0; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand-mark { width: 28px; height: 28px; flex: none; }
.case { display: block; flex: none; }
.case .ct { stroke: var(--brand-track); }
.case .cf { stroke: var(--brand); }
.case .cs { fill: var(--brand); }
.brand h1 { font-size: 1.1rem; }
.hdr-score { font-size: .8rem; font-variant-numeric: tabular-nums; display: flex; align-items: baseline; gap: 6px; background: var(--paper); border-radius: 999px; padding: 4px 14px; }
.hdr-score:empty { display: none; }
.hdr-score b { font-family: var(--f-display); font-size: 1.15rem; font-weight: 700; letter-spacing: -.02em; }
nav.tabs { display: flex; gap: 28px; overflow-x: auto; width: 100%; scrollbar-width: none; }
nav.tabs button { display: flex; align-items: center; gap: 6px; background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 0 12px; font-weight: 500; font-size: .92rem; color: var(--ink-2); cursor: pointer; white-space: nowrap; }
nav.tabs button .ic, nav.tabs .tab-n:empty { display: none; }
nav.tabs button[aria-current="page"] { color: var(--ink); font-weight: 600; border-bottom-color: var(--ink); }
nav.tabs button:hover { color: var(--ink); }
@media (max-width: 640px) {
  .top-in { padding-block: 10px; flex-wrap: nowrap; }
  .brand { min-width: 0; }
  .brand h1 { font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hdr-score { flex: none; padding: 3px 12px; }
  .hdr-score .eyebrow:first-child { display: none; }
  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; gap: 0; justify-content: space-around; background: var(--card); border-top: 1px solid var(--rule); padding: 6px max(8px, env(safe-area-inset-left, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)); }
  nav.tabs button { flex: 1; flex-direction: column; gap: 3px; padding: 4px 0; border-bottom: 0; font-size: .7rem; position: relative; }
  nav.tabs button .ic { display: block; width: 22px; height: 22px; }
  nav.tabs button[aria-current="page"] .ic { stroke-width: 2.1; }
  nav.tabs .tab-n { position: absolute; top: 0; left: calc(50% + 8px); background: var(--brand); color: #fff; border-radius: 999px; padding: 0 5px; font-size: .65rem; line-height: 1.5; }
  main.wrap { padding-bottom: calc(88px + env(safe-area-inset-bottom, 0px)); }
}

main.wrap { padding-block: 24px 64px; display: grid; gap: 24px; }
section.view { display: grid; gap: 24px; min-width: 0; }
.stack { display: grid; gap: 10px; min-width: 0; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.panel { background: var(--card); border: 1px solid var(--rule); border-radius: 16px; padding: 20px 24px; min-width: 0; box-shadow: var(--shadow); }
@media (max-width: 560px) { .panel { padding: 16px; border-radius: 14px; } }
.notice { border: 1px solid var(--rule); border-radius: 12px; background: var(--card); padding: 12px 16px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; font-size: .9rem; }
.notice p { max-width: 70ch; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 8px 18px; font-weight: 600; font-size: .9rem; cursor: pointer; transition: background-color .15s, border-color .15s, transform .1s; }
.btn:hover { background: color-mix(in srgb, var(--accent) 86%, var(--paper)); }
.btn:active { transform: scale(.98); }
.btn.ghost { background: var(--card); color: var(--ink); border-color: var(--rule-2); }
.btn.ghost:hover { border-color: var(--ink); background: var(--card); }
.btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.sm { min-height: 32px; padding: 4px 14px; font-size: .82rem; }
.btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; }
.x { background: none; border: 0; color: var(--ink-2); cursor: pointer; padding: 4px 8px; border-radius: 999px; font-size: 1.1rem; line-height: 1; }
.x:hover { color: var(--bad); background: color-mix(in srgb, var(--bad) 10%, transparent); }

input[type=text], input[type=number], input[type=month], input[type=date], input[type=tel], select, textarea { background: var(--card); border: 1px solid var(--rule-2); border-radius: 8px; padding: 7px 10px; min-width: 0; }
input[type=text]:focus, input[type=number]:focus, input[type=month]:focus, input[type=date]:focus, input[type=tel]:focus, select:focus, textarea:focus { border-color: var(--ink); outline: none; box-shadow: 0 0 0 1px var(--ink); }
textarea { width: 100%; min-height: 64px; resize: vertical; }
label.f { display: grid; gap: 6px; font-size: .85rem; font-weight: 500; color: var(--ink-2); }
label.f > input, label.f > select { color: var(--ink); font-size: .95rem; font-weight: 400; }

/* Overview */
.ell { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sum { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 12px 28px; }
.sum-score { display: grid; gap: 8px; align-content: start; }
.sum-note { grid-column: 1 / -1; border-top: 1px solid var(--rule); padding-top: 10px; }
@media (max-width: 760px) { .sum { grid-template-columns: 1fr; } }
.tab-n { font-size: .75rem; font-variant-numeric: tabular-nums; color: var(--ink-2); font-weight: 500; }
.next { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 16px 32px; }
.next .sum-score { order: -1; border-right: 1px solid var(--rule); padding-right: 28px; }
@media (max-width: 760px) { .next { grid-template-columns: 1fr; } .next .sum-score { border-right: 0; padding-right: 0; border-bottom: 1px solid var(--rule); padding-bottom: 16px; } }
.acts { list-style: none; margin: 0; padding: 0; display: grid; }
.act { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 6px 14px; align-items: start; padding: 14px 0; border-top: 1px solid var(--rule); }
.act-n { width: 40px; height: 40px; border-radius: 12px; background: var(--paper); color: var(--ink); display: grid; place-items: center; }
.ic { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.act-n .ic { width: 20px; height: 20px; }
.ic-s { width: 14px; height: 14px; }
.cat-td { display: flex; align-items: center; gap: 6px; color: var(--ink-2); }
.shop-chk > .ic { color: var(--ink-2); margin-top: 1px; }
.act-b { display: grid; gap: 2px; min-width: 0; }
.act-b b { font-size: 1rem; font-weight: 600; }
.act-do { display: flex; align-items: center; gap: 12px; padding-top: 2px; }
.gain { color: var(--good); font-size: .85rem; font-weight: 600; font-variant-numeric: tabular-nums; }
@media (max-width: 560px) { .act { grid-template-columns: 40px minmax(0, 1fr); } .act-do { grid-column: 2; } }
.score { display: flex; align-items: baseline; gap: 6px; }
.score .num { font-family: var(--f-display); font-size: 3.2rem; font-weight: 700; line-height: .9; letter-spacing: -.04em; }
.score .of { color: var(--ink-2); }
.ring { position: relative; width: 132px; height: 132px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 11; }
.ring .trk { stroke: var(--rule); }
.ring .val { stroke: var(--c); stroke-linecap: round; transition: stroke-dasharray .7s cubic-bezier(.2, .8, .2, 1); }
.ring .score { position: absolute; inset: 0; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
.ring .score .num { font-size: 2.6rem; }
.ring .score .of { font-size: .78rem; }
@media (prefers-reduced-motion: reduce) { .ring .val { transition: none; } }
.score .band { margin-left: 8px; }
.ring + .band { margin-top: 8px; }
.gaps { list-style: none; margin: 4px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); column-gap: 24px; }
.gaps li { display: grid; grid-template-columns: minmax(0, 7.5em) auto minmax(0, 1fr); gap: 10px; align-items: baseline; padding: 7px 0; border-bottom: 1px solid var(--rule); font-size: .88rem; }
.gaps li b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gaps .amt { font-variant-numeric: tabular-nums; font-size: .8rem; white-space: nowrap; }
.gaps .why { font-size: .8rem; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: right; }

.ov-cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.45fr); gap: 32px; align-items: start; }
@media (max-width: 900px) { .ov-cols { grid-template-columns: 1fr; } }
.sec-h { display: flex; justify-content: space-between; align-items: baseline; gap: 4px 12px; flex-wrap: wrap; }
.grp { display: grid; gap: 4px; }
.grp + .grp { margin-top: 14px; }
.grp-h { display: grid; gap: 2px; }

.hz { display: grid; grid-template-columns: minmax(0, 1fr); border-top: 1px solid var(--rule); }
.hz-row { display: grid; grid-template-columns: minmax(0, 1fr) 104px 56px 36px 24px; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--rule); font-size: .9rem; }
.hz-row.off { opacity: .5; }
.hz-name, .kit-name { display: flex; gap: 8px; align-items: baseline; background: none; border: 0; padding: 2px 0; text-align: left; cursor: pointer; }
.hz-name b, .kit-name b { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
.hz-name .mode, .kit-name .mode { flex: 1 1 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.hz-name:hover b, .kit-name:hover b { text-decoration: underline; text-underline-offset: 2px; }
.mode { font-size: .8rem; color: var(--ink-2); }
.bar { height: 6px; background: var(--rule); border-radius: 999px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--c); border-radius: 999px; }
.band { display: inline-flex; align-items: center; gap: 5px; font-size: .78rem; font-weight: 600; color: var(--ink); white-space: nowrap; }
.band i { width: 9px; height: 9px; border-radius: 2px; }
.pct { font-size: .85rem; text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.hz-row .x { padding: 2px 6px; font-size: 1rem; }
.hz-detail { grid-column: 1 / -1; display: grid; gap: 8px; padding: 4px 0 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: .78rem; border: 1px solid transparent; background: var(--paper); color: var(--ink); border-radius: 999px; padding: 4px 11px 4px 9px; font-variant-numeric: tabular-nums; }
.chip .ic { color: var(--ink-2); }
.chip.full { border-color: color-mix(in srgb, var(--good) 30%, transparent); background: color-mix(in srgb, var(--good) 9%, var(--card)); }
.chip.full .ic { color: var(--good); }
/* An essential pill: present is .chip.full with a check, missing is outlined with an empty circle and its points. */
.chip.ess { line-height: 1.3; text-align: left; max-width: 100%; }
.chip.ess .ic { stroke-width: 2; }
.chip.ess.miss { background: var(--card); border-color: var(--rule-2); }
.chip.ess .gain { font-size: inherit; }
/* One checklist category of named essentials: icon, name, "1 of 4" and a bar, its pills, then its button and notes. */
.ess-blk { display: grid; gap: 8px; padding: 10px 0 12px; border-top: 1px solid var(--rule); min-width: 0; }
.ess-h { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto 72px; gap: 8px; align-items: center; font-size: .9rem; }
.ess-h .ic { color: var(--ink-2); }
.ess-h b { font-weight: 600; }
.ess-h .of { font-variant-numeric: tabular-nums; font-weight: 600; font-size: .85rem; }
.ess-f { display: flex; gap: 6px 10px; align-items: center; flex-wrap: wrap; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.lvl { font-size: .8rem; padding: 4px 6px; }
.hz-lvl.alarm { color: var(--bad); font-weight: 600; }
.hz-lvl .pri { color: var(--brand); }
.hz-like { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; color: var(--ink-2); }
@media (max-width: 560px) {
  .hz-row { grid-template-columns: minmax(0, 1fr) 100px 36px 24px; }
  .hz-row > .bar, .hz-name .mode { display: none; }
  .hz-name, .hz-name b { white-space: normal; }
}
.kit-row { display: grid; grid-template-columns: minmax(0, 1fr) 72px 40px; gap: 2px 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--rule); font-size: .9rem; }
.kit-row .kit-miss { grid-column: 1 / -1; margin-top: -2px; }
.kit-pct { font-family: var(--f-display); font-size: 2rem; font-weight: 700; line-height: 1; letter-spacing: -.03em; }
.exp-row { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--rule); font-size: .88rem; }
.exp-row .flag { flex: none; font-size: .75rem; font-weight: 500; }

/* Kits */
.kits-grid { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 860px) { .kits-grid { grid-template-columns: 1fr; } }
.tags { display: grid; gap: 8px; }
.add-kit { justify-content: center; border-style: dashed; }
.tag { position: relative; text-align: left; background: var(--card); color: var(--ink); border: 1px solid var(--rule); border-radius: 14px; padding: 10px 92px 10px 10px; cursor: pointer; display: grid; grid-template-columns: 48px minmax(0, 1fr); align-items: center; gap: 0 12px; width: 100%; line-height: 1.3; box-shadow: var(--shadow); transition: border-color .15s, box-shadow .15s; }
.tag:hover { border-color: var(--rule-2); }
.tag[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.tag-img { grid-row: span 3; width: 48px; height: 48px; border-radius: 10px; background: var(--paper); color: var(--ink-2); display: grid; place-items: center; overflow: hidden; }
.tag-img img { width: 100%; height: 100%; object-fit: cover; }
.tag-img .ic { width: 22px; height: 22px; }
.tag-pct { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); display: flex; align-items: center; gap: 6px; font-family: var(--f-display); font-size: 1.15rem; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.tag b { font-size: 1rem; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tag .mono { font-size: .72rem; color: var(--ink-2); }
.tag .small { color: var(--ink-2); font-size: .8rem; }
.photos { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.photos img { width: 72px; height: 72px; object-fit: cover; border-radius: 10px; border: 1px solid var(--rule); flex: none; background: var(--rule); }
.tray { display: flex; flex-wrap: wrap; gap: 8px; }
.tray-ph { position: relative; margin: 0; }
.tray-ph img { display: block; width: 80px; height: 80px; object-fit: cover; border-radius: 10px; border: 1px solid var(--rule); background: var(--rule); }
.tray-ph .x { position: absolute; top: 4px; right: 4px; background: var(--card); padding: 1px 6px; font-size: 1rem; }
.drop-on { outline: 2px dashed var(--ink); outline-offset: 2px; }
.tbl-wrap { container-type: inline-size; overflow-x: auto; border: 1px solid var(--rule); border-radius: 14px; background: var(--card); box-shadow: var(--shadow); }
table { border-collapse: collapse; width: 100%; table-layout: fixed; font-size: .86rem; }
th { text-align: left; font-weight: 500; font-size: .78rem; color: var(--ink-2); padding: 10px 8px; border-bottom: 1px solid var(--rule); background: var(--paper); }
td { padding: 3px 6px; border-bottom: 1px solid var(--rule); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td input:not([type=checkbox]), td select { width: 100%; padding: 5px 6px; background: transparent; border-color: transparent; }
td input:hover, td select:hover, td input:focus, td select:focus { border-color: var(--rule-2); background: var(--card); }
td.num input { text-align: right; font-variant-numeric: tabular-nums; appearance: textfield; padding-inline: 3px; }
td.num input::-webkit-inner-spin-button, td.num input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
td .flag { font-size: .78rem; font-weight: 500; }
.flag.expired { color: var(--bad); } .flag.soon { color: var(--warn); }
td.val { padding-right: 8px; }
.val-in { display: flex; align-items: center; gap: 6px; }
.vbar { flex: 1; height: 6px; background: var(--rule); border-radius: 999px; overflow: hidden; }
.vbar i { display: block; height: 100%; background: var(--ink-2); border-radius: 999px; }
.val-in b { width: 2.2em; text-align: right; font-weight: 500; font-variant-numeric: tabular-nums; }
.buy { display: inline-block; padding: 0 6px 2px; text-decoration: none; font-weight: 500; }
.buy:hover { text-decoration: underline; }
.val-note { display: block; font-size: .7rem; line-height: 1.2; color: var(--ink-2); padding-bottom: 2px; }
.th-sort { white-space: nowrap; background: none; border: 0; padding: 0; font: inherit; color: inherit; letter-spacing: inherit; text-transform: inherit; cursor: pointer; }
.th-sort[aria-pressed="true"] { color: var(--ink); font-weight: 600; }
.th-sort:hover { color: var(--ink); }
tr.addrow td { background: var(--paper); }
.working { display: flex; gap: 10px; align-items: center; }
.pulse { width: 10px; height: 10px; border-radius: 50%; background: var(--brand); animation: pulse 1.2s ease-in-out infinite; flex: none; }
@keyframes pulse { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }

.pack-ms { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px 28px; }
.pack-m { display: grid; gap: 6px; }
.pack-lim { display: inline-flex; align-items: center; gap: 6px; }
.pack-lim input { width: 72px; }

@container (max-width: 599px) {

.selbar { display: flex; gap: 10px 14px; align-items: center; flex-wrap: wrap; padding: 12px 16px; border: 1px solid var(--bad); border-radius: 12px; background: color-mix(in srgb, var(--bad) 7%, var(--card)); }

.hdr-score.up b { color: var(--good); transition: color .2s; }

   or "none" when the household said it is not one of them. Ids are saved in item docs, so they never change once
   shipped: new ones can be added, and an id taken off the list just reads as untagged. `perMed` is needed once
   for each person on daily medication. */
const ESSENTIALS = {
  documents: [{ id: "id_copies", label: "ID copies" }, { id: "insurance", label: "Insurance cards" }, { id: "cash", label: "Cash" }, { id: "records", label: "Records (USB or printed)" }],
  fire_safety: [{ id: "extinguisher", label: "Fire extinguisher" }, { id: "fire_blanket", label: "Fire blanket" }, { id: "escape_ladder", label: "Escape ladder" }],
  communication: [{ id: "radio", label: "Emergency radio" }, { id: "whistle", label: "Whistle" }, { id: "contact_list", label: "Printed contact list" }],
  tools: [{ id: "multitool", label: "Multi-tool or knife" }, { id: "duct_tape", label: "Duct tape" }, { id: "shutoff_wrench", label: "Utility shut-off wrench" }, { id: "fire_starter", label: "Lighter or matches" }],
  medications: [{ id: "pain_reliever", label: "Pain or fever reliever" }, { id: "allergy_med", label: "Allergy medicine" }, { id: "prescriptions", label: "Prescriptions", perMed: true }],
};
const essentialList = cat => Object.hasOwn(ESSENTIALS, cat) ? ESSENTIALS[cat] : [];

function essentialOf(it) {
  const e = it?.essential;
  if (e === "none") return "none";
  return typeof e === "string" && essentialList(it.category).some(x => x.id === e) ? e : "";
}

   with several, no label says whose is in the kit. */

  const onMeds = (Array.isArray(h?.members) ? h.members : []).map((m, i) => [m, i]).filter(([m]) => m && onDailyMeds(m));
  return essentialList(cat).flatMap(({ id, label, perMed }) => !perMed ? [{ id, label }]
    : onMeds.length === 1 ? [{ id, label: `${personName(...onMeds[0])}'s prescriptions` }]

}

function formatReview(t) {
  const out = []; let list = [];
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  const flush = () => { if (list.length) { out.push(`<ul>${list.map(l => `<li>${inline(l)}</li>`).join("")}</ul>`); list = []; } };
  for (const raw of t.split("\n")) {
    const line = raw.trim();
    if (!line) { flush(); continue; }
    if (/^#{1,4}\s/.test(line)) { flush(); out.push(`<h3>${inline(line.replace(/^#+\s*/, ""))}</h3>`); }
    else if (/^([-*•]|\d+[.)])\s/.test(line)) list.push(line.replace(/^([-*•]|\d+[.)])\s+/, ""));
    else { flush(); out.push(`<p>${inline(line)}</p>`); }
  }
  flush();
  return out.join("");
}

/* Days the stock would keep everyone going: the lower of water (3.8 L a person, about 1 L a pet) and food. */
const daysCovered = (st, h) => !st || !h.people ? 0 : Math.min(st.liters / (h.people * 3.8 + h.pets), h.kcalDay ? st.kcal / h.kcalDay : 0);
const MILESTONES = { home: [1, 3, 7, 14], go: [1, 3] };
const calm = () => typeof requestAnimationFrame !== "function" || !!window.matchMedia?.("(prefers-reduced-motion: reduce)").matches;
function celebrate(M) {
  if (!S.loaded) return;
  const now = { overall: M.overall, home: daysCovered(M.stocks.shelter, M.h), go: daysCovered(M.stocks.evacuate, M.h) };
  const prev = S.prev; S.prev = now;
  if (!prev) return;
  if (now.overall != null && prev.overall != null && now.overall > prev.overall) countUp(prev.overall, now.overall);
  const hit = k => [...MILESTONES[k]].reverse().find(d => prev[k] < d && now[k] >= d);
  const home = hit("home"), go = hit("go"), days = d => `${d} day${d === 1 ? "" : "s"}`;
  const msg = home ? `Milestone: your supplies at home now last ${days(home)} for everyone.`
    : go ? `Milestone: your go-bags and car kits now cover ${days(go)} on the move.` : "";
  if (msg) setTimeout(() => { if (!toastAction) toast(msg); }, 1600);

// A "+N" chip rises from the ticked row into the header score, which counts up as it lands
function flyPoints(from, n) {
  const to = $("#hdr-score");
  if (calm() || !from || !(n > 0) || typeof to?.animate !== "function") return;
  const b = to.getBoundingClientRect(), chip = document.createElement("span");
  chip.className = "fly"; chip.textContent = `+${n}`; chip.setAttribute("aria-hidden", "true");
  document.body.append(chip);
  const x = Math.min(from.right - 80, window.innerWidth - 60), y = from.top + from.height / 2 - chip.offsetHeight / 2;
  chip.style.left = `${x}px`; chip.style.top = `${y}px`;
  const dx = b.left + b.width / 2 - chip.offsetWidth / 2 - x, dy = b.top + b.height / 2 - chip.offsetHeight / 2 - y;
  chip.animate([{ transform: "translate(0, 0)", opacity: 0 }, { transform: "translate(0, -8px)", opacity: 1, offset: .15 },
    { transform: `translate(${dx}px, ${dy}px) scale(.7)`, opacity: 1, offset: .9 }, { transform: `translate(${dx}px, ${dy}px) scale(.6)`, opacity: 0 }],
    { duration: 700, easing: "cubic-bezier(.4, 0, .2, 1)" }).onfinish = () => chip.remove();
  S.flyUntil = performance.now() + 630;
}
function countUp(from, to) {
  const hdr = $("#hdr-score");
  hdr.classList.remove("up"); void hdr.offsetWidth; hdr.classList.add("up");
  clearTimeout(S.upT); S.upT = setTimeout(() => hdr.classList.remove("up"), 1300);
  if (calm()) return;
  const t0 = Math.max(performance.now(), S.flyUntil || 0);
  const step = t => {
    const k = Math.min(1, Math.max(0, t - t0) / 700), v = Math.round(from + (to - from) * (1 - (1 - k) ** 3));
    document.querySelectorAll("#hdr-score b, .sum-score .num").forEach(n => { n.textContent = v; });
    if (k < 1) S.upRaf = requestAnimationFrame(step);
  };
  cancelAnimationFrame(S.upRaf); S.upRaf = requestAnimationFrame(step);
}

async function shrink(file, max = 1600) {
  try {
    const bmp = await createImageBitmap(file);
    const s = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas");
    c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise(r => c.toBlob(b => r(b || file), "image/jpeg", 0.85));
  } catch (_) { return file; }
}
function cleanRows(out) {
  const arr = Array.isArray(out) ? out : Array.isArray(out?.items) ? out.items : [];
  return arr.filter(x => x && String(x.name || "").trim()).map(x => ({
    key: uid(),
    name: String(x.name).trim().slice(0, 80),
    category: CATS[x.category] ? x.category : "other",
    qty: Math.max(1, Math.round(num(x.qty) || 1)),
    liters: Math.round(num(x.liters) * 10) / 10,
    kcal: Math.round(num(x.kcal)),
    lb: lb1(num(x.grams)),
    L: Math.round(num(x.ml) / 100) / 10,
    expires: /^\d{4}-\d{2}$/.test(x.expires || "") ? x.expires : "",
    note: String(x.note || "").slice(0, 120),
    shop: typeof x.shop === "string" ? x.shop.trim().slice(0, 120) : "",
  }));
}
/* Photos wait in a tray until you read them, so a kit can be shot one photo at a time (a phone
   camera takes one per pick) and Claude still sees them all together. The tray lives in memory only. */
const TRAY_MAX = 20;
const photoKey = f => [f.name, f.size, f.lastModified].join("|");
function addToTray(files) {
  const kit = S.kits.find(k => k.id === S.openKit);
  const imgs = files.filter(f => /^image\//.test(f?.type || ""));
  if (!kit || !imgs.length) return;
  if (S.tray?.kitId !== kit.id) clearTray();
  S.tray ||= { kitId: kit.id, photos: [] };
  const have = new Set(S.tray.photos.map(p => photoKey(p.file)));
  const fresh = imgs.filter(f => !have.has(photoKey(f)) && have.add(photoKey(f)));
  const room = TRAY_MAX - S.tray.photos.length;
  for (const f of fresh.slice(0, room)) {
    let url = ""; try { url = URL.createObjectURL(f); } catch (_) {}
    S.tray.photos.push({ key: uid(), file: f, url });
  }
  if (fresh.length > room) toast(`Up to ${TRAY_MAX} photos at a time. Read these, then add the rest.`);
  render();
}
function clearTray() {
  for (const p of S.tray?.photos || []) try { URL.revokeObjectURL(p.url); } catch (_) {}
  S.tray = null;
}
async function scanPhotos(files) {
  const kit = S.kits.find(k => k.id === S.openKit);
  if (!kit || !files.length || S.scan?.state === "working") return;
  if (!sample) { toast("Reading photos needs Claude, which this view can't reach. Add items by hand instead."); return; }
  const lim = await sample.limits().catch(() => null);
  if (!lim?.images) { toast("This view can't send photos to Claude. Add items by hand instead."); return; }
  const ctl = new AbortController();
  S.scan = { kitId: kit.id, state: "working", msg: `Preparing ${files.length} photo${files.length > 1 ? "s" : ""}…`, ctl };
  render();
  const photoIds = [];
  try {
    const blobs = [];
    for (const f of files) blobs.push(await shrink(f));
    if (assets) {
      S.scan.msg = "Saving photos…"; render();
      for (const b of blobs) { try { photoIds.push((await assets.upload(b, { type: b.type || "image/jpeg" })).id); } catch (_) {} }
    }
    const max = lim.images.maxCount || 5;
    let rows = [];
    for (let i = 0; i < blobs.length; i += max) {
      S.scan.msg = blobs.length > max ? `Claude is reading photos ${i + 1}–${Math.min(blobs.length, i + max)} of ${blobs.length}…` : "Claude is reading your photos. This can take a minute…";
      render();
      rows = rows.concat(cleanRows(await sample.json(photoPrompt(kit), { images: blobs.slice(i, i + max), signal: ctl.signal })));
    }
    // Photos read while you're still checking an earlier list add to that list.
    const prev = S.draft?.kitId === kit.id ? S.draft : null;
    S.draft = { kitId: kit.id, rows: [...(prev?.rows || []), ...rows], photoIds: [...(prev?.photoIds || []), ...photoIds] };
    S.scan = null;
    if (S.tray?.kitId === kit.id) clearTray();
  } catch (e) {
    for (const id of photoIds) assets?.delete(id).catch(() => {});
    S.scan = e?.code === "cancelled" ? null : { kitId: kit.id, state: "error", msg: sampleErr(e) };
  }
  render();
}

  delItem: b => removeItems([b.dataset.id]),
  addItem: async () => {
    const name = $("#add-name").value.trim();
    if (!name) { $("#add-name").focus(); return; }
    const row = { kitId: S.openKit, name, category: $("#add-cat").value, qty: Math.max(1, Math.round(num($("#add-qty").value) || 1)), liters: num($("#add-l").value), kcal: num($("#add-k").value), grams: gOfLb($("#add-g").value), ml: Math.round(num($("#add-ml").value) * 1000), expires: $("#add-exp").value || "", note: "", source: "manual", addedAt: Date.now() };
    $("#add-name").value = "";
    await setDoc("items", uid(), row).catch(() => {});
    $("#add-name")?.focus();
  },
  delKit: async b => {
    const id = b.dataset.id; const kit = S.kits.find(k => k.id === id);
    S.confirm = null;
    const items = S.items.filter(i => i.kitId === id);
    try {
      await Promise.all(items.map(i => delDoc("items", i.id)));
      for (const p of kit?.photos || []) assets?.delete(p).catch(() => {});
      await delDoc("kits", id);
      S.openKit = null; toast(`Deleted ${kit?.name || "kit"}`);
    } catch (_) {}
    render();
  },
  hhAdd: b => { const k = b.dataset.k; S.hhDraft[k] = [...(S.hhDraft[k] || []), k === "members" ? { label: "", age: "adult", needs: "" } : { kind: "", count: 1 }]; S.hhDirty = true; render(); },
  hhDel: b => { const k = b.dataset.k; S.hhDraft[k].splice(+b.dataset.i, 1); S.hhDirty = true; render(); },
  condToggle: b => {
    const k = b.dataset.k, ms = S.hhDraft.members || [];
    const has = ms.filter(m => (m.conditions || []).includes(k));
    if (has.length) { has.forEach(m => { m.conditions = m.conditions.filter(c => c !== k); }); S.condOpen.delete(k); S.hhDirty = true; }
    else if (ms.length === 1) { ms[0].conditions = [...(ms[0].conditions || []), k]; S.hhDirty = true; }
    else S.condOpen.has(k) ? S.condOpen.delete(k) : S.condOpen.add(k);
    render();
  },
  startWizard: () => { S.view = "household"; S.wiz = 0; try { history.replaceState(null, "", "#household"); } catch (_) {} render(); window.scrollTo({ top: 0 }); },
  wizBack: () => { S.wiz = Math.max(0, S.wiz - 1); render(); },
  wizClose: () => { S.wiz = null; render(); },
  wizNext: () => wizStep(),
  // A gap's button carries its category and, for a named essential, the essential; a counted category needs only the first.
  shopAdd: b => {
    const M = model(), key = gapKey({ cat: b.dataset.cat, essential: b.dataset.essential });
    const g = [...splitListed(M.gaps).off, ...M.gaps].find(x => gapKey(x) === key); if (!g) return;
    saveShop([...shopItems(), shopFromGap(g, M.h)]);
    toast(`Added ${gapName(g)} to your shopping list`);
  },
  // A checklist block's button: its missing essentials that are household gaps not on the list yet, in the emergency or kit it's in
  shopAddBlock: b => {
    const M = model(), { cat, at = "" } = b.dataset, i = at.indexOf(":"), kind = at.slice(0, i), id = at.slice(i + 1);
    const r = kind === "kit" ? (Object.hasOwn(M.kitRes, id) ? M.kitRes[id] : null) : kind === "hz" ? M.results.find(x => x.hz.id === id) : null;
    const row = r?.rows.find(x => x.cat === cat && x.ess);
    const off = new Set(splitListed(M.gaps).off);
    const add = [...new Set(row ? row.ess.filter(e => !e.have).map(e => essGap(M, cat, e)).filter(g => g && off.has(g)) : [])];
    if (!add.length) { toast("Already on your shopping list"); return; }
    saveShop([...shopItems(), ...add.map(g => shopFromGap(g, M.h))]);
    toast(add.length === 1 ? `Added ${gapName(add[0])} to your shopping list` : `Added ${add.length} items to your shopping list`);
  },
  shopAddAll: () => {
    const M = model();
    const add = splitListed(M.gaps).off.map(g => shopFromGap(g, M.h));
    if (!add.length) { toast("Every gap is already on your list"); return; }
    saveShop([...shopItems(), ...add]);
    toast(`Added ${add.length} item${add.length === 1 ? "" : "s"} to your shopping list`);
  },
  shopAddTop: () => {
    const M = model();
    const add = splitListed(M.gaps).off.map(g => ({ g, gain: M.overall == null ? 0 : scoreIfFilled(M, [g]) - M.overall }))
      .sort((a, b) => b.gain - a.gain || b.g.imp - a.g.imp).slice(0, 5).map(x => shopFromGap(x.g, M.h));
    if (!add.length) return;
    saveShop([...shopItems(), ...add]);
    toast(`Added the top ${add.length} to your shopping list`);
  },
  budgetClear: () => { S.budget = ""; render(); },
  shopDel: b => saveShop(shopItems().filter(x => x.id !== b.dataset.id)),
  shopClear: () => saveShop(shopItems().filter(x => !x.done)),
  shopShare: () => shareShop(),
  hzCheck: runHazardCheck,
  rvRun: runReview,
  rvStop: () => S.rv?.ctl?.abort(),
  clearExamples: async () => {
    S.confirm = null;
    try {
      const drop = S.kits.filter(isExampleKit), keep = S.kits.filter(k => k.example && !isExampleKit(k));
      await Promise.all(S.items.filter(i => i.example).map(i => delDoc("items", i.id)));
      await Promise.all(drop.map(k => delDoc("kits", k.id)));
      await Promise.all(keep.map(k => setDoc("kits", k.id, { ...strip(k), example: false })));
      if (S.profile?.example) { await delDoc("household", "profile"); S.hhDraft = blankHousehold(); S.hhDirty = false; }
      S.openKit = null; toast("Examples removed");
    } catch (_) {}
    render();
  },
};
document.addEventListener("click", e => { const b = e.target.closest("[data-act]"); if (b && !b.disabled && ACT[b.dataset.act]) { e.preventDefault(); ACT[b.dataset.act](b); } });
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.input === "draft") {
    const r = S.draft?.rows[+t.dataset.i]; if (r) r[t.dataset.f] = t.value;
  } else if (t.dataset.input === "hh") {
    setPath(S.hhDraft, t.dataset.p, t.type === "number" ? (t.value === "" && t.dataset.blank ? "" : num(t.value)) : t.value);
    if (t.dataset.blank) { S.hhDirty = true; render(); return; }
    if (!S.hhDirty) { S.hhDirty = true; const btn = $('form[data-submit="saveHH"] button[type=submit]'); if (btn) btn.disabled = false; }
  }
});
document.addEventListener("toggle", e => { const id = e.target.dataset?.how; if (id) e.target.open ? S.how.add(id) : S.how.delete(id); }, true);
document.addEventListener("change", async e => {
  const t = e.target;
  if (t.dataset.change === "item") {
    const it = S.items.find(i => i.id === t.dataset.id); if (!it) return;
    const f = t.dataset.f;
    let v = t.value;
    if (f === "qty") v = Math.max(1, Math.round(num(v) || 1)); else if (f === "liters" || f === "kcal") v = num(v); else if (f === "grams") v = gOfLb(v); else if (f === "ml") v = Math.round(num(v) * 1000); else if (f === "name") { v = v.trim(); if (!v) { t.value = it.name; return; } }
    if (it[f] === v) return;
    await setDoc("items", it.id, { ...strip(it), [f]: v }).catch(() => {});
  } else if (t.dataset.change === "packLim") {
    const kit = S.kits.find(k => k.id === t.dataset.id); if (!kit) return;
    const f = t.dataset.f, v = f === "carryKg" ? kgOfLb(t.value) : Math.round(num(t.value) * 2) / 2;
    if (v === num(kit[f]) || f === "carryKg" && Math.round(v * KG_LB) === Math.round(num(kit[f]) * KG_LB)) return;
    const { [f]: _, ...rest } = strip(kit);
    await setDoc("kits", kit.id, v ? { ...rest, [f]: v } : rest).catch(() => {});
  } else if (t.dataset.change === "serves") {
    const kit = S.kits.find(k => k.id === t.dataset.id); if (!kit) return;
    const v = Math.min(50, Math.round(num(t.value)));
    if (!v) { t.value = num(kit.serves) || household().people; return; }
    if (v === num(kit.serves)) return;
    await setDoc("kits", kit.id, { ...strip(kit), serves: v }).catch(() => {});
  } else if (t.dataset.change === "sel") {
    t.checked ? S.sel.add(t.dataset.id) : S.sel.delete(t.dataset.id);
    render();
  } else if (t.dataset.change === "selAll") {
    const ids = S.items.filter(i => i.kitId === S.openKit).map(i => i.id);
    if (t.checked) ids.forEach(id => S.sel.add(id)); else S.sel.clear();
    render();
  } else if (t.dataset.change === "hhCond") {
    const m = S.hhDraft.members?.[+t.dataset.i]; if (!m) return;
    const cs = new Set(m.conditions || []);
    t.checked ? cs.add(t.dataset.k) : cs.delete(t.dataset.k);
    m.conditions = [...cs];
    S.hhDirty = true; render();
  } else if (t.dataset.change === "shopTick") {
    shopTick(t.dataset.id, t.checked, t.closest(".shop-row"));
  } else if (t.dataset.change === "shopKit") {
    saveShop(shopItems().map(x => x.id === t.dataset.id ? { ...x, kitId: t.value } : x));
  } else if (t.dataset.change === "plan") {
    const v = t.value.trim().slice(0, 120);
    if ((S.plan?.[t.dataset.f] || "") === v) return;
    await savePlan({ ...(S.plan || {}), [t.dataset.f]: v });
  } else if (t.dataset.change === "planMed") {
    const meds = clone(S.plan?.meds || []);
    if (!meds[+t.dataset.i]) return;
    meds[+t.dataset.i][t.dataset.f] = t.value.trim().slice(0, 80);
    await savePlan({ ...(S.plan || {}), meds });
  } else if (t.dataset.change === "shopSort") {
    S.shopSort = t.value; render();
  } else if (t.dataset.change === "budget") {
    S.budget = Math.max(0, Math.round(num(t.value))) || ""; render();
  } else if (t.dataset.change === "importance") {
    const importance = { ...(S.hazards?.importance || {}), [t.dataset.id]: t.value };
    if (t.value === "normal") delete importance[t.dataset.id];
    await setDoc("household", "hazards", { ...(S.hazards || {}), importance }).catch(() => {});
  } else if (t.dataset.change === "level") {
    const levels = { ...(S.hazards?.levels || {}), [t.dataset.id]: t.value };
    await setDoc("household", "hazards", { ...(S.hazards || {}), levels }).catch(() => {});
  } else if (t.id === "photo-input") {
    addToTray([...t.files]);
  }
});
/* Dropping photos on the photo panel adds them to the tray. A file dropped anywhere else is ignored
   rather than opened, which would navigate away from the page. */
const dropZone = e => S.canWrite && e.target.closest?.("[data-drop]");
document.addEventListener("dragover", e => {
  if (!e.dataTransfer?.types?.includes("Files")) return;
  e.preventDefault();
  const z = dropZone(e);
  e.dataTransfer.dropEffect = z ? "copy" : "none";
  z?.classList.add("drop-on");
});
document.addEventListener("dragleave", e => { const z = dropZone(e); if (z && !z.contains(e.relatedTarget)) z.classList.remove("drop-on"); });
document.addEventListener("drop", e => {
  if (!e.dataTransfer?.types?.includes("Files")) return;
  e.preventDefault();
  const z = dropZone(e);
  if (z) { z.classList.remove("drop-on"); addToTray([...e.dataTransfer.files]); }
});
document.addEventListener("submit", async e => {
  e.preventDefault();
  const f = e.target;
  if (f.dataset.submit === "newKit") {
    const name = $("#nk-name").value.trim(); if (!name) return;
    const type = KIT_TYPES[$("#nk-type").value] ? $("#nk-type").value : "go";
    const id = uid();
    await setDoc("kits", id, { name, type, where: $("#nk-where").value.trim(), photos: [], createdAt: Date.now() }).catch(() => {});
    S.openKit = id; S.addKit = false; f.reset(); render();
  } else if (f.dataset.submit === "saveHH") {
    await saveHousehold();
  } else if (f.dataset.submit === "wizNext") {
    await wizStep();
  } else if (f.dataset.submit === "shopNew") {
    const text = $("#shop-new").value.trim(); if (!text) return;
    $("#shop-new").value = "";
    await saveShop([...shopItems(), { id: uid(), cat: "", text: text.slice(0, 80), done: false, at: Date.now() }]);
    $("#shop-new")?.focus();
  }
});
async function saveHousehold() {
  const d = clone(S.hhDraft);
  d.members = (d.members || []).map(m => ({ label: String(m.label || "").trim(), years: yearsOf(m) == null ? null : Math.floor(yearsOf(m)), age: groupOf(m), needs: String(m.needs || "").trim(), conditions: (m.conditions || []).filter(c => CONDITIONS[c]) }));
  if (!d.members.length) d.members = [{ label: "", age: "adult", needs: "" }];
  d.pets = (d.pets || []).filter(p => num(p.count)).map(p => ({ kind: String(p.kind || "").trim(), count: num(p.count) }));
  d.location = String(d.location || "").trim();
  const data = { ...d, example: false, updatedAt: Date.now() };
  try { await setDoc("household", "profile", data); } catch (_) { return false; }
  if (db) S.profile = clone(data);
  S.hhDirty = false; S.hhDraft = d; S.condOpen.clear(); toast("Household saved"); render();
  return true;
}
/* Last step saves, then shows the next steps; a new location gets its hazards checked straight away. */
async function wizStep() {
  if (S.wiz < WIZ.length - 1) { S.wiz++; render(); window.scrollTo({ top: 0 }); return; }
  if (!(await saveHousehold())) return;
  S.wiz = null; S.view = "overview";
  try { history.replaceState(null, "", "#overview"); } catch (_) {}
  render(); window.scrollTo({ top: 0 });
  if (S.profile?.location && S.hazards?.location !== S.profile.location && sample) runHazardCheck();
}
/* Ticking an item puts it in its kit (so the gap closes); unticking takes that item back out. */
async function shopTick(id, on, rowEl) {
  const items = clone(shopItems()), e = items.find(x => x.id === id); if (!e) return;
  const from = rowEl?.getBoundingClientRect?.(); // measured now: saving re-renders the list
  if (on) {
    const kit = S.kits.find(k => k.id === shopKit(e));
    if (kit && CATS[e.cat]) {
      const before = model().overall, itemId = uid();
      flyPoints(from, shopInfo(e, model()).gain); // the row's points are exactly what the tick adds (tests/shopping.test.js)
      try {
        await setDoc("items", itemId, { ...itemFromShop(e, kit.id), addedAt: Date.now() });
      } catch (_) { render(); return; }
      e.itemId = itemId; e.inKit = kit.id;
      const after = model().overall;
      toast(`Put in ${kit.name}${after > before ? `. Readiness ${before} → ${after}` : ""}`);
    }
    e.done = true;
    S.flash = e.id; clearTimeout(S.flashT); S.flashT = setTimeout(() => { S.flash = null; }, 1400);
  } else {
    if (e.itemId && S.items.some(i => i.id === e.itemId)) await delDoc("items", e.itemId).catch(() => {});
    e.done = false; delete e.itemId; delete e.inKit;
  }
  await saveShop(items);
}
async function shareShop() {
  const left = shopItems().filter(x => !x.done);
  if (!left.length) return;
  const M = model();
  const text = "Emergency kit shopping list\n" + left.map(x => { const i = shopInfo(x, M); return `- ${i.line}${i.sub && i.sub !== i.line ? ` (${i.sub})` : ""}`; }).join("\n");
  try { if (navigator.share) { await navigator.share({ title: "Emergency kit shopping list", text }); return; } }
  catch (e) { if (e?.name === "AbortError") return; }
  try { await navigator.clipboard.writeText(text); toast("List copied. Paste it into a message or your notes."); }
  catch (_) { toast("This view can't copy. Select the list and copy it instead."); }
}

/* ---------- boot ---------- */
// The household form before anything is saved: a new household, and the one left after clearing the examples.
function blankHousehold() { return { members: [{ label: "", age: "adult", needs: "" }], pets: [], vehicles: 0, home: "House", location: "" }; }
function syncDraft() { if (!S.hhDirty) S.hhDraft = clone(S.profile) || blankHousehold(); }
document.querySelectorAll("#tabs button").forEach(b => b.insertAdjacentHTML("afterbegin", icon(TAB_ICON[b.dataset.v])));
syncDraft();
render();
(async () => {
  const use = n => window.claude?.use ? window.claude.use(n).catch(() => null) : Promise.resolve(null);
  const [d, a, s, u] = await Promise.all([use("db"), use("assets"), use("sample"), use("user")]);
  db = d; assets = a; sample = s;
  if (u) { try { const ok = await u.canEdit(); if (ok === false) S.canWrite = false; } catch (_) {} }
  document.body.classList.toggle("ro", !S.canWrite);
  if (!db) {
    S.loaded = true; render(); return;
  }
  S.live = true;
  const timer = setTimeout(() => { S.slow = true; render(); }, 10000);
  const seen = new Set();
  const all = Object.keys(COLS).length + HOUSEHOLD_DOCS.length;
  const done = (k, snap) => { if (!snap.metadata?.fromCache) seen.add(k); if (seen.size >= all) { S.loaded = true; S.slow = false; clearTimeout(timer); } };
  const fail = () => { clearTimeout(timer); S.loaded = true; render(); };
  for (const [key, col] of Object.entries(COLS)) {
    db.collection(col).onSnapshot(snap => { S[key] = snap.docs.map(x => ({ id: x.id, ...x.data() })); done(key, snap); render(); }, fail);
  }
  for (const key of HOUSEHOLD_DOCS) {
    db.doc("household/" + key).onSnapshot(snap => {
      S[key] = snap.exists ? clone(snap.data()) : null;
      if (key === "profile") syncDraft();
      done(key, snap); render();
    }, fail);
  }
})();
</script>
